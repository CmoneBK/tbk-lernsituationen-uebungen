<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Titelkonvention: "Bereich: Unterkategorie - Name"
     Beispiele:
       Fertigungstechnik: Messmittel - Messschieber ablesen
       Werkstofftechnik: Wärmebehandlung - Härten und Anlassen
       Fertigungstechnik: ISO-Toleranzen          (ohne Unterkategorie)
     Getrennt wird am " - " MIT Leerzeichen davor und dahinter - Bindestriche
     im Text ("Form- und Lagetoleranzen") stören also nicht. -->
<title>Bereich: Unterkategorie - Name der Seite</title>
<style>
  :root{
    --bg:#f7f7f5; --fg:#1a1a1a; --muted:#5f5f5a;
    --card:#fff; --border:#e3e3df; --accent:#2b6cb0;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#151517; --fg:#ececec; --muted:#a0a0a0;
      --card:#1e1e21; --border:#2c2c30; --accent:#5b9bd5;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{width:100%; max-width:820px; margin:0 auto; padding:0 20px}
  /* Platz fuer den schwebenden Ruecklink oben links. */
  header{padding:72px 0 8px}
  h1{font-size:clamp(24px,4vw,32px); letter-spacing:-.5px; margin:0 0 10px}
  .lead{color:var(--muted); font-size:17px; margin:0}
  h2{font-size:20px; margin:38px 0 8px; padding-top:22px; border-top:1px solid var(--border)}
  .box{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; box-shadow:var(--shadow); margin:16px 0;
  }
  a{color:var(--accent)}
  footer{
    color:var(--muted); font-size:13px; text-align:center;
    padding:36px 0 32px; border-top:1px solid var(--border); margin-top:48px;
  }
</style>
</head>
<body>
  <header class="wrap">
    <h1>Name der Seite</h1>
    <p class="lead">Ein Satz dazu, worum es geht und was am Ende herauskommt.</p>
  </header>

  <main class="wrap">
    <h2>Auftrag</h2>
    <div class="box">
      <p>Was ist zu tun?</p>
    </div>

    <h2>Material</h2>
    <div class="box">
      <p>Unterlagen, Tabellenbuch-Seiten, Werkzeuge.</p>
    </div>

    <h2>Ergebnissicherung</h2>
    <div class="box">
      <p>Woran erkennt man, dass es sitzt?</p>
    </div>
  </main>

  <footer class="wrap">&copy; 2026 t-bk.de</footer>

<!-- Rücklink zur Übersicht. Der Pfad zählt aus dieser Datei heraus:
       lernsituationen/x.html        -> ../assets/back-nav.js
       lernsituationen/x/index.html  -> ../../assets/back-nav.js
     Fehlt die Zeile, trägt "node build/build.mjs" sie automatisch nach. -->
<script src="../assets/back-nav.js"></script>
</body>
</html>
